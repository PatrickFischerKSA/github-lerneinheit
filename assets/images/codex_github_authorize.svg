<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GitHub-Verbindung erlauben</title>
  <desc id="desc">Screenshot-Grafik einer GitHub-Autorisierung mit markiertem Installieren- oder Autorisieren-Button.</desc>
  <rect width="1200" height="720" rx="36" fill="#f7f1e8"/>
  <rect x="95" y="70" width="1010" height="580" rx="28" fill="#ffffff" stroke="#ded6ca" stroke-width="4"/>
  <rect x="95" y="70" width="1010" height="76" rx="28" fill="#1f2328"/>
  <text x="145" y="119" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">GitHub</text>
  <text x="190" y="205" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#243447">ChatGPT/Codex möchte auf GitHub zugreifen</text>
  <rect x="190" y="250" width="820" height="210" rx="22" fill="#f6f8fa" stroke="#d8dee4" stroke-width="3"/>
  <text x="230" y="305" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243447">Was du erlaubst:</text>
  <text x="230" y="355" font-family="Arial, sans-serif" font-size="24" fill="#57606a">• ausgewählte Repositories lesen</text>
  <text x="230" y="398" font-family="Arial, sans-serif" font-size="24" fill="#57606a">• Dateien anzeigen und Änderungen vorbereiten</text>
  <text x="230" y="441" font-family="Arial, sans-serif" font-size="24" fill="#57606a">• Zugriff später wieder ändern</text>
  <rect x="650" y="510" width="250" height="70" rx="35" fill="#85a38f"/>
  <text x="708" y="554" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Authorize</text>
  <rect x="920" y="510" width="120" height="70" rx="35" fill="#e8efe9"/>
  <text x="948" y="554" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243447">Install</text>
  <circle cx="650" cy="505" r="28" fill="#c47b57"/>
  <text x="642" y="515" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#fff">1</text>
  <path d="M670 515 C700 520 715 530 735 543" stroke="#c47b57" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="190" y="615" width="820" height="46" rx="23" fill="#fff7eb" stroke="#e2caa7" stroke-width="2"/>
  <text x="225" y="646" font-family="Arial, sans-serif" font-size="22" fill="#8a4f2b">Klicke auf Authorize, Autorisieren, Install oder Installieren.</text>
</svg>
