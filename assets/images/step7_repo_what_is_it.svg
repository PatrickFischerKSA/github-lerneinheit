<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Warum GitHub und ein Repository gebraucht werden</title>
  <desc id="desc">Erklärung, wofür GitHub und ein Repository da sind.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffaf2" stroke="#d8c6ad" stroke-width="6"/>
  <rect x="120" y="120" width="1360" height="72" rx="20" fill="#e7d8c2"/>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4b3e33">Neues Repository: Projektort für deine Website</text>
  <rect x="120" y="240" width="640" height="500" rx="28" fill="#ffffff" stroke="#d8c6ad" stroke-width="4"/>
  <text x="160" y="305" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#4b3e33">Was GitHub hier leistet</text>
  <text x="160" y="365" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• speichert deine Dateien online</text>
  <text x="160" y="420" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• hält alle Projektteile zusammen</text>
  <text x="160" y="475" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• bewahrt Pfade und Verknüpfungen</text>
  <text x="160" y="530" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• macht spätere Veröffentlichung möglich</text>
  <text x="160" y="585" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• sorgt dafür, dass die Website richtig reagiert</text>
  <text x="160" y="665" font-family="Arial, sans-serif" font-size="24" fill="#8a4f2b">Noch keine fertige Website:</text>
  <text x="160" y="705" font-family="Arial, sans-serif" font-size="24" fill="#8a4f2b">Das Repo ist zuerst der geordnete Online-Ort.</text>
  <rect x="840" y="240" width="590" height="500" rx="28" fill="#fff" stroke="#d8c6ad" stroke-width="4"/>
  <rect x="900" y="320" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="420" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="520" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="620" width="470" height="70" rx="18" fill="#efe2cf"/>
  <text x="940" y="365" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">index.html</text>
  <text x="940" y="465" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">style.css</text>
  <text x="940" y="565" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">app.js</text>
  <text x="940" y="665" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">assets/</text>
  <line x1="1030" y1="355" x2="1030" y2="425" stroke="#6c88c7" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1030,445 1017,420 1043,420" fill="#6c88c7"/>
  <line x1="1070" y1="355" x2="1070" y2="525" stroke="#8f7f66" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1070,545 1057,520 1083,520" fill="#8f7f66"/>
  <line x1="1110" y1="355" x2="1110" y2="625" stroke="#a8794c" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1110,645 1097,620 1123,620" fill="#a8794c"/>
  <text x="1140" y="405" font-family="Arial, sans-serif" font-size="22" fill="#5c5147">HTML ruft CSS für das Layout auf</text>
  <text x="1140" y="505" font-family="Arial, sans-serif" font-size="22" fill="#5c5147">HTML lädt JavaScript für Reaktionen</text>
  <text x="1140" y="605" font-family="Arial, sans-serif" font-size="22" fill="#5c5147">HTML findet Bilder und Medien im Ordner</text>
  <text x="760" y="790" font-family="Arial, sans-serif" font-size="22" fill="#6f6255">Das Repository speichert also nicht nur Dateien, sondern auch das Netz ihrer Beziehungen.</text>
</svg>
