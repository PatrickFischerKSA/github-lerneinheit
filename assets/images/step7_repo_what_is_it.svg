<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalter für Schritt 7</title>
  <desc id="desc">Erklärung, wofür GitHub und ein Repository da sind.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#fffaf2" stroke="#d8c6ad" stroke-width="6"/>
  <rect x="120" y="120" width="1360" height="72" rx="20" fill="#e7d8c2"/>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4b3e33">Neues Repository: Projektort für deine Website</text>
  <rect x="120" y="240" width="640" height="500" rx="28" fill="#ffffff" stroke="#d8c6ad" stroke-width="4"/>
  <text x="160" y="305" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#4b3e33">Was GitHub hier leistet</text>
  <text x="160" y="365" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• speichert deine Dateien online</text>
  <text x="160" y="420" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• hält alle Projektteile zusammen</text>
  <text x="160" y="475" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• macht spätere Veröffentlichung möglich</text>
  <text x="160" y="530" font-family="Arial, sans-serif" font-size="28" fill="#5c5147">• zeigt die Struktur des Webprojekts</text>
  <text x="160" y="615" font-family="Arial, sans-serif" font-size="24" fill="#8a4f2b">Noch keine fertige Website:</text>
  <text x="160" y="655" font-family="Arial, sans-serif" font-size="24" fill="#8a4f2b">Das Repo ist zuerst der geordnete Online-Ort.</text>
  <rect x="840" y="240" width="590" height="500" rx="28" fill="#fff" stroke="#d8c6ad" stroke-width="4"/>
  <rect x="900" y="320" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="420" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="520" width="470" height="70" rx="18" fill="#efe2cf"/>
  <rect x="900" y="620" width="470" height="70" rx="18" fill="#efe2cf"/>
  <text x="940" y="365" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">index.html</text>
  <text x="940" y="465" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">style.css</text>
  <text x="940" y="565" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">app.js</text>
  <text x="940" y="665" font-family="Courier New, monospace" font-size="28" fill="#4b3e33">assets/</text>
  <text x="840" y="790" font-family="Arial, sans-serif" font-size="22" fill="#6f6255">Platzhalter: später durch echten Screenshot ersetzen</text>
</svg>
